name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.3', laravel: '12.*', testbench: '10.*', statamic: '^5.73' }
          - { php: '8.4', laravel: '12.*', testbench: '10.*', statamic: '^6' }
          - { php: '8.5', laravel: '13.*', testbench: '11.*', statamic: '^6' }

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / Statamic ${{ matrix.statamic }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: composer update --with "laravel/framework:${{ matrix.laravel }}" --with "orchestra/testbench:${{ matrix.testbench }}" --with "statamic/cms:${{ matrix.statamic }}" --prefer-dist --no-interaction

      - run: composer validate --strict
      - run: composer audit --locked
      - run: vendor/bin/pint --test

      - name: Execute tests
        run: vendor/bin/pest --ci

  required:
    name: Package checks
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.test.result }}
